<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Le marché de Nounou">
  <title>Le marché de Nounou</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app" class="app">
    <header class="app-header">
      <button type="button" id="btn-back" class="btn btn-back" hidden aria-label="Retour">← Retour</button>
      <div class="brand">
        <h1 class="app-title">Le marché de Nounou</h1>
        <p id="app-subtitle" class="app-subtitle">Qu'est-ce qu'on achète aujourd'hui ?</p>
      </div>
    </header>

    <main class="app-main">
      <section id="view-home" class="view view-home" aria-label="Familles">
        <div id="category-grid" class="category-grid"></div>
      </section>

      <section id="view-category" class="view view-category" hidden aria-label="Articles">
        <h2 id="category-title" class="section-title"></h2>
        <div id="product-grid" class="product-grid"></div>
        <p id="scroll-hint" class="scroll-hint">Encore des articles ↓</p>
      </section>

      <section id="view-product" class="view view-product" hidden aria-label="Fiche article">
        <div class="product-sheet">
          <h2 id="product-name" class="product-name"></h2>
          <div class="product-sheet-body">
            <img id="product-image" class="product-image" src="assets/images/interface/placeholder.svg" alt="">
            <div class="product-actions">
              <div class="qty-controls qty-controls-lg">
                <button type="button" id="btn-qty-minus" class="btn btn-qty" aria-label="Diminuer la quantité">−</button>
                <span id="product-qty" class="qty-value" aria-live="polite">1</span>
                <button type="button" id="btn-qty-plus" class="btn btn-qty" aria-label="Augmenter la quantité">+</button>
              </div>
              <button type="button" id="btn-add-to-cart" class="btn btn-primary btn-add">Ajouter au panier</button>
            </div>
          </div>
        </div>
      </section>

      <section id="view-recap" class="view view-recap" hidden aria-label="Récapitulatif">
        <h2 class="section-title">Voici tes courses</h2>
        <div id="recap-lines" class="recap-lines"></div>
        <p id="recap-total" class="recap-total"></p>
        <div class="recap-actions">
          <button type="button" id="btn-recap-continue" class="btn btn-secondary">Continuer mes courses</button>
          <button type="button" id="btn-finish" class="btn btn-primary">Terminer les courses</button>
        </div>
      </section>

      <section id="view-done" class="view view-done" hidden aria-label="Félicitations">
        <div class="done-card">
          <img src="assets/images/interface/bravo.svg" alt="" class="done-image">
          <h2 class="done-title">Bravo !</h2>
          <p class="done-text">Tes courses sont terminées.</p>
          <button type="button" id="btn-restart" class="btn btn-primary btn-lg">Recommencer</button>
        </div>
      </section>
    </main>

    <footer id="cart-bar" class="cart-bar" aria-label="Panier">
      <button type="button" id="cart-summary" class="cart-summary" aria-label="Ouvrir mon panier">
        <p class="cart-empty-label">Mon panier est vide</p>
      </button>
      <div class="cart-side">
        <span id="cart-total" class="cart-total"></span>
        <button type="button" id="btn-validate-cart" class="btn btn-primary btn-validate" disabled>
          Valider le panier
        </button>
      </div>
    </footer>
  </div>

  <div id="overlay" class="overlay" hidden></div>

  <div id="modal-cart" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modal-cart-title">
    <div class="modal-panel">
      <h2 id="modal-cart-title" class="modal-title">Mon panier</h2>
      <div id="cart-lines" class="cart-lines"></div>
      <div class="modal-actions">
        <button type="button" id="btn-continue-shopping" class="btn btn-secondary">Continuer mes courses</button>
        <button type="button" id="btn-empty-cart" class="btn btn-danger">Vider le panier</button>
        <button type="button" id="btn-validate-from-cart" class="btn btn-primary">Valider le panier</button>
      </div>
    </div>
  </div>

  <div id="modal-confirm" class="modal modal-confirm" hidden role="dialog" aria-modal="true" aria-labelledby="modal-confirm-title">
    <div class="modal-panel modal-panel-sm">
      <h2 id="modal-confirm-title" class="modal-title">Vider tout le panier ?</h2>
      <div class="modal-actions modal-actions-row">
        <button type="button" id="btn-confirm-empty-no" class="btn btn-secondary">Non, garder mon panier</button>
        <button type="button" id="btn-confirm-empty-yes" class="btn btn-danger">Oui, vider</button>
      </div>
    </div>
  </div>

  <div id="modal-recap" class="modal" hidden></div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="js/catalog.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
